[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docrag"
version = "2.0.0"
description = "本地技术文档 RAG 问答系统（CPU 可跑）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "openai>=1.40,<3",
    "chromadb>=0.5,<2",
    "sentence-transformers>=3.0,<7",
    "numpy>=1.26,<3",
    "jieba>=0.42,<1",
    "rank-bm25>=0.2.2,<1",
    "pypdf>=4.0,<7",
    "rich>=13.7,<15",
    "loguru>=0.7,<1",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
download = ["modelscope>=1.18"]
rerank = ["onnxruntime>=1.18"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
docrag = "docrag.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "SIM"]
lint.ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
